        price_kopecks: {type: "integer", minimum: 0, format: "int64"}
        main_limit: {type: "integer", minimum: 1}
        starts_at: {type: "string", format: "date-time"}
        ends_at: {type: "string", format: "date-time"}
        registration_opens_at: {type: "string", format: "date-time"}
      additionalProperties: false
      minProperties: 1

    GameSummary:
      type: "object"
      required: ["game_id", "title", "format", "hall_id", "hall_name", "starts_at", "ends_at", "registration_opens_at", "status", "price_kopecks", "main_limit", "main_count", "waitlist_count"]
      properties:
        game_id: {$ref: "#/components/schemas/ID"}
        title: {type: "string", minLength: 1}
        format: {$ref: "#/components/schemas/GameFormat"}
        hall_id: {$ref: "#/components/schemas/ID"}
        hall_name: {type: "string"}
        starts_at: {type: "string", format: "date-time"}
        ends_at: {type: "string", format: "date-time"}
        registration_opens_at: {type: "string", format: "date-time"}
        status:
          type: "string"
          enum: ["scheduled", "in_progress", "finished", "cancelled"]
        price_kopecks: {type: "integer", minimum: 0, format: "int64"}
        main_limit: {type: "integer", minimum: 1}
        main_count: {type: "integer", minimum: 0, description: "Размер основного состава."}
        waitlist_count: {type: "integer", minimum: 0}

    Game:
      type: "object"
      required: ["game_id", "title", "format", "hall_id", "hall_name", "starts_at", "ends_at", "registration_opens_at", "status", "price_kopecks", "main_limit", "main_count", "waitlist_count", "description", "owner_id"]
      properties:
        game_id: {$ref: "#/components/schemas/ID"}
        title: {type: "string", minLength: 1}
        format: {$ref: "#/components/schemas/GameFormat"}
        hall_id: {$ref: "#/components/schemas/ID"}
        hall_name: {type: "string"}
        starts_at: {type: "string", format: "date-time"}
        ends_at: {type: "string", format: "date-time"}
        registration_opens_at: {type: "string", format: "date-time"}
        status:
          type: "string"
          enum: ["scheduled", "in_progress", "finished", "cancelled"]
        price_kopecks: {type: "integer", minimum: 0, format: "int64"}
        main_limit: {type: "integer", minimum: 1}
        main_count: {type: "integer", minimum: 0}
        waitlist_count: {type: "integer", minimum: 0}
        description: {type: "string"}
        owner_id: {$ref: "#/components/schemas/ID"}
        series_id: {$ref: "#/components/schemas/ID"}

    GamePage:
