        venue_id: {$ref: "#/components/schemas/ID"}
        name: {type: "string"}

    Venue:
      type: "object"
      required: ["venue_id", "name", "address"]
      properties:
        venue_id: {$ref: "#/components/schemas/ID"}
        name: {type: "string", minLength: 1}
        address: {type: "string", minLength: 1}

    VenuePage:
      type: "object"
      required: ["items"]
      properties:
        items:
          type: "array"
          items: {$ref: "#/components/schemas/Venue"}
