          type: "string"
          enum: ["self", "ban", "game_cancelled"]
        late_cancel:
          type: "boolean"
          description: "Присутствует с причиной отмены. true означает, что самоотмена учитывается в дисциплине."

    RosterEntry:
      type: "object"
      required: ["registration", "display_name"]
      properties:
