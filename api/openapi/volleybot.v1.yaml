openapi: "3.1.1"
info:
  title: "VolleyBOT REST API"
  version: "1.0.0"
  description: "Контракт по этапам дорожной карты. x-stage указывает этап появления операции. x-access задаёт минимальную роль; правила владения ресурсами указаны в описании операций."
servers:
  - {url: "/api/v1"}
tags:
  - {name: "users", description: "Аккаунты, сессии, роли, баны и настройки."}
  - {name: "games", description: "Площадки, игры, серии, записи, составы и явка."}
security:
  - BearerAuth: []
paths:

  "/auth/register":
    post:
      tags: ["users"]
      summary: "Зарегистрировать аккаунт"
      description: "Создаёт пользователя с ролью user. Администратор назначается через CLI."
      operationId: "registerAccount"
      x-stage: "08"
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/SignUp"}
      responses:
        "201":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Account"}
        "400": {$ref: "#/components/responses/Error400"}
        "409": {$ref: "#/components/responses/Error409"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/auth/login":
    post:
      tags: ["users"]
      summary: "Получить токены"
      operationId: "login"
      x-stage: "08"
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/auth/refresh":
    post:
      tags: ["users"]
      summary: "Обновить сессию с ротацией refresh-токена"
      description: "Повторное предъявление использованного refresh-токена отзывает refresh-токены пользователя."
      operationId: "refreshSession"
      x-stage: "08"
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/RefreshToken"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/auth/logout":
    post:
      tags: ["users"]
      summary: "Отозвать refresh-токен"
      description: "Повторный запрос с уже отозванным токеном даёт тот же результат."
      operationId: "logout"
      x-stage: "08"
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/RefreshToken"}
      responses:
        "204": {description: "Операция выполнена."}
        "400": {$ref: "#/components/responses/Error400"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/me":
    get:
      tags: ["users"]
      summary: "Получить свой аккаунт"
      description: "Доступен при активном бане для просмотра причины и срока."
      operationId: "getMyAccount"
      x-stage: "09"
      x-access: "user"
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Account"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/me/profile":
    patch:
      tags: ["users"]
      summary: "Изменить свой профиль"
      description: "При первом заполнении обязательны first_name, last_name, birth_date, height_cm и skill_level. experience_years по умолчанию равен 0. Для существующего профиля поля, которых нет в запросе, сохраняются. Null в position очищает амплуа."
      operationId: "updateMyProfile"
      x-stage: "09"
      x-access: "user"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/ProfileUpdate"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/users/{user_id}/role":
    parameters:
      - name: "user_id"
        in: "path"
        required: true
        schema: {$ref: "#/components/schemas/ID"}
    put:
      tags: ["users"]
      summary: "Назначить или снять роль модератора"
      description: "Роль администратора защищена от изменений через API."
      operationId: "assignUserRole"
      x-stage: "09"
      x-access: "admin"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/AssignRole"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Account"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/users/{user_id}/ban":
    parameters:
      - name: "user_id"
        in: "path"
        required: true
        schema: {$ref: "#/components/schemas/ID"}
    put:
      tags: ["users"]
      summary: "Установить или заменить бан"
      description: "Модератор может банить только пользователей с ролью user. Администратор может банить пользователей и модераторов. Null в ends_at означает бессрочный бан."
      operationId: "banUser"
      x-stage: "09"
      x-access: "moderator"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/BanRequest"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Ban"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}
    delete:
      tags: ["users"]
      summary: "Снять бан"
      description: "Правила по ролям совпадают с установкой бана. При отсутствии активного бана возвращает 204."
      operationId: "liftUserBan"
      x-stage: "09"
      x-access: "moderator"
      responses:
        "204": {description: "Операция выполнена."}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/me/telegram/link":
    post:
      tags: ["users"]
      summary: "Получить одноразовую ссылку на привязку Telegram"
      description: "Токен действует 10 минут и передаётся боту при открытии ссылки."
      operationId: "createTelegramLink"
      x-stage: "16"
      x-access: "user"
      responses:
        "201":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/TelegramLink"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "409": {$ref: "#/components/responses/Error409"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/me/telegram":
    delete:
      tags: ["users"]
      summary: "Отвязать свой Telegram"
      operationId: "unlinkMyTelegram"
      x-stage: "16"
      x-access: "user"
      responses:
        "204": {description: "Операция выполнена."}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/me/notification-settings":
    get:
      tags: ["users"]
      summary: "Получить настройки уведомлений"
      operationId: "getMyNotificationSettings"
      x-stage: "16"
      x-access: "user"
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/NotificationSettings"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}
    put:
      tags: ["users"]
      summary: "Заменить настройки уведомлений"
      operationId: "replaceMyNotificationSettings"
      x-stage: "16"
      x-access: "user"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/NotificationSettings"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/NotificationSettings"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/venues":
    get:
      tags: ["games"]
      summary: "Посмотреть площадки"
      operationId: "listVenues"
      x-stage: "10"
      x-access: "moderator"
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/VenuePage"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}
    post:
      tags: ["games"]
      summary: "Создать площадку с первым залом"
      operationId: "createVenue"
      x-stage: "10"
      x-access: "admin"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/CreateVenue"}
      responses:
        "201":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Venue"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/venues/{venue_id}":
    parameters:
      - name: "venue_id"
        in: "path"
        required: true
        schema: {$ref: "#/components/schemas/ID"}
    put:
      tags: ["games"]
      summary: "Изменить площадку"
      operationId: "updateVenue"
      x-stage: "10"
      x-access: "admin"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/VenueData"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Venue"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}
    delete:
      tags: ["games"]
      summary: "Удалить площадку"
      description: "Сервисы сохраняют историю игр. Удаление возможно, если ни у одного зала площадки нет игр."
      operationId: "deleteVenue"
      x-stage: "10"
      x-access: "admin"
      responses:
        "204": {description: "Операция выполнена."}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/venues/{venue_id}/halls":
    parameters:
      - name: "venue_id"
        in: "path"
        required: true
        schema: {$ref: "#/components/schemas/ID"}
    get:
      tags: ["games"]
      summary: "Посмотреть залы площадки"
      operationId: "listVenueHalls"
      x-stage: "10"
      x-access: "moderator"
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/HallPage"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}
    post:
      tags: ["games"]
      summary: "Добавить зал на площадку"
      operationId: "createHall"
      x-stage: "10"
      x-access: "admin"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/HallData"}
      responses:
        "201":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Hall"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/halls/{hall_id}":
    parameters:
      - name: "hall_id"
        in: "path"
        required: true
        schema: {$ref: "#/components/schemas/ID"}
    put:
      tags: ["games"]
      summary: "Изменить название зала"
      operationId: "updateHall"
      x-stage: "10"
      x-access: "admin"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/HallData"}
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Hall"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}
    delete:
      tags: ["games"]
      summary: "Удалить зал"
      description: "Последний зал площадки и зал с играми защищены от удаления."
      operationId: "deleteHall"
      x-stage: "10"
      x-access: "admin"
      responses:
        "204": {description: "Операция выполнена."}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/game-formats":
    get:
      tags: ["games"]
      summary: "Получить справочник форматов игр"
      operationId: "listGameFormats"
      x-stage: "11"
      x-access: "public"
      security: []
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema:
                type: "array"
                items: {$ref: "#/components/schemas/GameFormatInfo"}
        "400": {$ref: "#/components/responses/Error400"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/games":
    get:
      tags: ["games"]
      summary: "Посмотреть игры и число записавшихся"
      description: "По умолчанию выдаёт предстоящие игры. Ответ содержит числа участников и листа ожидания. Гость также может запросить предстоящие игры через бота."
      operationId: "listGames"
      x-stage: "11"
      x-access: "public"
      security: []
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - name: "starts_from"
          in: "query"
          schema: {type: "string", format: "date-time"}
          description: "Нижняя граница времени начала включительно. По умолчанию момент первого запроса."
        - name: "starts_before"
          in: "query"
          schema: {type: "string", format: "date-time"}
          description: "Верхняя граница времени начала исключительно."
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/GamePage"}
        "400": {$ref: "#/components/responses/Error400"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}
    post:
      tags: ["games"]
      summary: "Создать разовую игру"
      description: "Владельцем становится автор. Без registration_opens_at запись открывается сразу."
      operationId: "createGame"
      x-stage: "11"
      x-access: "moderator"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {$ref: "#/components/schemas/GameCreate"}
      responses:
        "201":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/Game"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}

  "/games/{game_id}":
    parameters:
      - name: "game_id"
        in: "path"
        required: true
        schema: {$ref: "#/components/schemas/ID"}
    get:
      tags: ["games"]
      summary: "Посмотреть игру и число записавшихся"
      operationId: "getGame"
      x-stage: "11"
      x-access: "public"
      security: []
      responses:
        "200":
          description: "Операция выполнена."
          content:
            "application/json":
              schema: {$ref: "#/components/schemas/GameDetails"}
        "400": {$ref: "#/components/responses/Error400"}
        "404": {$ref: "#/components/responses/Error404"}
        "429": {$ref: "#/components/responses/Error429"}
        "503": {$ref: "#/components/responses/Error503"}
        default: {$ref: "#/components/responses/UnexpectedError"}
    patch:
      tags: ["games"]
      summary: "Изменить одну игру"
