    SeriesEnd:
      oneOf:
        - type: "object"
          required: ["until"]
          properties:
            until: {type: "string", format: "date"}
          additionalProperties: false
        - type: "object"
          required: ["occurrences"]
          properties:
            occurrences: {type: "integer", minimum: 1}
          additionalProperties: false
      description: "Последняя местная дата включительна либо предел числа запланированных повторений."

    SeriesCreate:
      type: "object"
      required: ["title", "hall_id", "price_kopecks", "main_limit", "starts_at", "time_zone", "weekdays", "duration_minutes"]
      properties:
        title: {type: "string", minLength: 1}
        description: {type: "string"}
        format: {$ref: "#/components/schemas/GameFormat"}
        hall_id: {$ref: "#/components/schemas/ID"}
        price_kopecks: {type: "integer", minimum: 0, format: "int64"}
        main_limit: {type: "integer", minimum: 1}
        starts_at: {type: "string", format: "date-time"}
        time_zone:
          type: "string"
          description: "Часовой пояс серии из базы IANA, например Europe/Moscow."
        weekdays:
          type: "array"
          items:
            type: "string"
            enum: ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
          minItems: 1
          uniqueItems: true
        duration_minutes: {type: "integer", minimum: 30, maximum: 360}
        registration_opens_days_before: {type: "integer", minimum: 0, default: 7}
        end: {$ref: "#/components/schemas/SeriesEnd"}
