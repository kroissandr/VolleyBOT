      required: ["team_number", "players"]
      properties:
        team_number: {type: "integer", minimum: 1}
        players:
          type: "array"
          items: {$ref: "#/components/schemas/TeamPlayer"}

    MyTeam:
      type: "object"
      required: ["assignment_version", "team_number", "stale", "players"]
      properties:
