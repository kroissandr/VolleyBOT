    HallPage:
      type: "object"
      required: ["items"]
      properties:
        items:
          type: "array"
          items: {$ref: "#/components/schemas/Hall"}
        next_cursor: {type: "string", minLength: 1, description: "Отсутствует на последней странице."}

    GameFormat:
      type: "string"
