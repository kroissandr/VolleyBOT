      type: "object"
      required: ["user_id", "email", "role", "telegram_linked"]
      properties:
        user_id: {$ref: "#/components/schemas/ID"}
        email: {type: "string", format: "email"}
        role: {$ref: "#/components/schemas/Role"}
        profile: {$ref: "#/components/schemas/Profile"}
        active_ban: {$ref: "#/components/schemas/Ban"}
        telegram_linked: {type: "boolean"}

    AssignRole:
      type: "object"
      required: ["role"]
      properties:
        role:
          type: "string"
          enum: ["user", "moderator"]
      additionalProperties: false

    BanRequest:
      type: "object"
      required: ["reason", "ends_at"]
      properties:
        reason: {type: "string", minLength: 1}
        ends_at:
          type: ["string", "null"]
          format: "date-time"
      additionalProperties: false

    Ban:
      type: "object"
      required: ["reason", "ends_at"]
      properties:
        reason: {type: "string"}
        ends_at:
          type: ["string", "null"]
          format: "date-time"

    TelegramLink:
      type: "object"
      required: ["url", "expires_at"]
      properties:
        url: {type: "string", format: "uri"}
        expires_at: {type: "string", format: "date-time"}

    NotificationSettings:
      type: "object"
      required: ["telegram_enabled", "disabled_notification_types"]
      properties:
        telegram_enabled: {type: "boolean"}
        disabled_notification_types:
          type: "array"
          items: {$ref: "#/components/schemas/NotificationType"}
          uniqueItems: true
      additionalProperties: false

    NotificationType:
      type: "string"
      enum: ["game_updated", "game_cancelled", "registration_promoted", "registration_demoted", "teams_published", "teams_reset", "series_conflict", "user_banned", "user_unbanned", "game_reminder"]

    VenueData:
      type: "object"
      required: ["name", "address"]
      properties:
        name: {type: "string", minLength: 1}
        address: {type: "string", minLength: 1}
