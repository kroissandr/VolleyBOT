        default: {$ref: "#/components/responses/UnexpectedError"}
components:
  securitySchemes:

    BearerAuth: {type: "http", scheme: "bearer", bearerFormat: "JWT"}
  parameters:

    Limit:
      name: "limit"
      in: "query"
      schema: {type: "integer", minimum: 1, maximum: 100, default: 20}

    Cursor:
      name: "cursor"
      in: "query"
      schema: {type: "string", minLength: 1}
      description: "Непрозрачный next_cursor из предыдущей страницы."
  responses:

    Error400:
      description: "Параметр, курсор или тело запроса некорректны."
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Problem"}

    Error401:
      description: "Сессия отсутствует, недействительна или истекла."
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Problem"}
      headers:
        WWW-Authenticate:
          description: "Ответ защищённой операции указывает схему Bearer."
          schema: {type: "string"}

    Error403:
      description: "Недостаточно прав или действует бан."
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Problem"}

    Error404:
      description: "Ресурс не найден."
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Problem"}

    Error409:
      description: "Конфликт с текущим состоянием или занятостью зала."
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Problem"}

    Error503:
      description: "Не удалось получить актуальные данные из зависимого сервиса."
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Problem"}

    UnexpectedError:
      description: "Сбой обработки запроса."
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Problem"}

    Error429:
      description: "Превышен лимит запросов. Лимитирование появляется на этапе 19."
      headers:
        Retry-After:
          description: "Время ожидания в секундах, если оно известно."
          schema: {type: "integer", minimum: 0}
      content:
        "application/json":
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:

    ID: {type: "string", minLength: 1, description: "Непрозрачный идентификатор."}

    Problem:
      type: "object"
      required: ["code", "message"]
      properties:
        code: {type: "string", minLength: 1}
        message: {type: "string", minLength: 1}
        violations:
          type: "array"
          items: {$ref: "#/components/schemas/FieldViolation"}
        conflicts:
          type: "array"
          items: {$ref: "#/components/schemas/HallConflict"}
        registration_opens_at: {type: "string", format: "date-time"}
        ban: {$ref: "#/components/schemas/Ban"}
        request_id: {type: "string", minLength: 1}

    FieldViolation:
      type: "object"
      required: ["field", "message"]
      properties:
        field:
          type: "string"
          description: "Путь в теле запроса в формате JSON Pointer либо имя параметра."
        message: {type: "string"}

    HallConflict:
      type: "object"
      required: ["game_id", "hall_id", "starts_at", "ends_at"]
      properties:
        game_id: {$ref: "#/components/schemas/ID"}
        hall_id: {$ref: "#/components/schemas/ID"}
        starts_at: {type: "string", format: "date-time"}
        ends_at: {type: "string", format: "date-time"}

    Role:
      type: "string"
      enum: ["user", "moderator", "admin"]

    SkillLevel:
      type: "string"
      enum: ["beginner", "intermediate", "advanced"]

    PlayerPosition:
      type: "string"
      enum: ["setter", "outside_hitter", "middle_blocker", "opposite", "libero"]

    Credentials:
      type: "object"
      required: ["email", "password"]
      properties:
        email: {type: "string", format: "email"}
        password:
          type: "string"
          minLength: 1
          format: "password"
          writeOnly: true
          description: "Секрет пользователя, передаётся только по HTTPS."
      additionalProperties: false

    SignUp:
      type: "object"
      required: ["email", "password"]
      properties:
        email: {type: "string", format: "email"}
        password:
          type: "string"
          minLength: 1
          format: "password"
          writeOnly: true
          description: "Секрет пользователя, передаётся только по HTTPS."
      additionalProperties: false

    RefreshToken:
      type: "object"
      required: ["refresh_token"]
      properties:
        refresh_token: {type: "string", minLength: 1}
      additionalProperties: false

    Session:
      type: "object"
      required: ["access_token", "refresh_token", "expires_in"]
      properties:
        access_token: {type: "string"}
        refresh_token: {type: "string"}
        expires_in: {type: "integer", minimum: 1, description: "Срок жизни access-токена в секундах."}

    Profile:
      type: "object"
      required: ["first_name", "last_name", "birth_date", "height_cm", "experience_years", "skill_level"]
      properties:
        first_name: {type: "string", minLength: 1}
        last_name: {type: "string", minLength: 1}
        birth_date: {type: "string", format: "date"}
        height_cm: {type: "integer", minimum: 100, maximum: 250}
        experience_years: {type: "integer", minimum: 0, maximum: 60}
        skill_level: {$ref: "#/components/schemas/SkillLevel"}
        position:
          oneOf:
            - {$ref: "#/components/schemas/PlayerPosition"}
            - {type: "null"}

    ProfileUpdate:
      type: "object"
      properties:
        first_name: {type: "string", minLength: 1}
        last_name: {type: "string", minLength: 1}
        birth_date: {type: "string", format: "date"}
        height_cm: {type: "integer", minimum: 100, maximum: 250}
        experience_years: {type: "integer", minimum: 0, maximum: 60}
        skill_level: {$ref: "#/components/schemas/SkillLevel"}
        position:
          oneOf:
            - {$ref: "#/components/schemas/PlayerPosition"}
            - {type: "null"}
      additionalProperties: false
      minProperties: 1

