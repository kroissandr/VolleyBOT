        series_id: {$ref: "#/components/schemas/ID"}
        owner_id: {$ref: "#/components/schemas/ID"}
        status:
          type: "string"
          enum: ["active", "ended", "cancelled"]
        title: {type: "string", minLength: 1}
        description: {type: "string"}
        format: {$ref: "#/components/schemas/GameFormat"}
        hall_id: {$ref: "#/components/schemas/ID"}
        price_kopecks: {type: "integer", minimum: 0, format: "int64"}
        main_limit: {type: "integer", minimum: 1}
        starts_at: {type: "string", format: "date-time"}
        time_zone:
          type: "string"
          description: "Часовой пояс серии из базы IANA, например Europe/Moscow."
        weekdays:
          type: "array"
          items:
            type: "string"
            enum: ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
          minItems: 1
          uniqueItems: true
        duration_minutes: {type: "integer", minimum: 30, maximum: 360}
        registration_opens_days_before: {type: "integer", minimum: 0, default: 7}
        end: {$ref: "#/components/schemas/SeriesEnd"}

    SeriesPage:
      type: "object"
      required: ["items"]
      properties:
        items:
          type: "array"
          items: {$ref: "#/components/schemas/Series"}
        next_cursor: {type: "string", minLength: 1, description: "Отсутствует на последней странице."}

    Registration:
      type: "object"
      required: ["registration_id", "game_id", "user_id", "status"]
      properties:
        registration_id: {$ref: "#/components/schemas/ID"}
        game_id: {$ref: "#/components/schemas/ID"}
        user_id: {$ref: "#/components/schemas/ID"}
        status:
          type: "string"
          enum: ["active", "cancelled", "attended", "no_show"]
